name: CI — SecuroSpace

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ────────────────────────────────────────────
  # Web App Validation
  # ────────────────────────────────────────────
  validate-web:
    name: 🌐 Validate Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML structure
        run: |
          echo "Checking index.html exists and is valid..."
          test -f index.html
          test -f style.css
          test -f app.js
          test -f crypto-helper.js
          echo "✅ All web files present"

      - name: Check for console.log in production JS
        run: |
          echo "Checking for debug statements..."
          if grep -rn "console\.log" app.js crypto-helper.js; then
            echo "⚠️ Warning: console.log found in source files"
          else
            echo "✅ No debug console.log statements found"
          fi

  # ────────────────────────────────────────────
  # Android Build
  # ────────────────────────────────────────────
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Sync web assets to Android
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html style.css app.js crypto-helper.js android/app/src/main/assets/
          echo "✅ Assets synced"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecuroSpace-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  # ────────────────────────────────────────────
  # Deploy to GitHub Pages (main branch only)
  # ────────────────────────────────────────────
  deploy-pages:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [validate-web]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
