<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="20%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#143e45" />
      <stop offset="50%" stop-color="#0a1c22" />
      <stop offset="100%" stop-color="#051015" />
    </radialGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ad7d6" />
      <stop offset="100%" stop-color="#3dc9c5" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(24, 46, 54, 0.9)" />
      <stop offset="100%" stop-color="rgba(11, 24, 29, 0.95)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Subtle grid lines -->
  <g stroke="rgba(106, 215, 214, 0.08)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Glow circle in background -->
  <circle cx="950" cy="280" r="180" fill="rgba(61, 201, 197, 0.15)" filter="url(#glow)" />

  <!-- Logo Mark -->
  <g transform="translate(100, 100)">
    <rect width="64" height="64" rx="18" fill="url(#accentGrad)" />
    <text x="32" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#062228" text-anchor="middle">S</text>
    <text x="86" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="34" fill="#ffffff" letter-spacing="1">SecuroSpace</text>
  </g>

  <!-- Tagline / Eyebrow -->
  <g transform="translate(100, 220)">
    <rect width="320" height="34" rx="17" fill="rgba(106, 215, 214, 0.12)" stroke="rgba(106, 215, 214, 0.3)" />
    <text x="160" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#6ad7d6" text-anchor="middle" letter-spacing="2">ZERO-KNOWLEDGE LIFE OS</text>
  </g>

  <!-- Title -->
  <text x="100" y="320" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="54" fill="#ffffff" letter-spacing="-1">
    Own your routines,
  </text>
  <text x="100" y="380" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="54" fill="url(#accentGrad)" letter-spacing="-1">
    finances &amp; passwords.
  </text>

  <!-- Subtitle -->
  <text x="100" y="440" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" fill="#a9c5c7">
    Tasks • Habit Tracker • Finance Ledger • Encrypted Vault
  </text>
  <text x="100" y="480" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" fill="#6ad7d6">
    End-to-end encrypted with zero tracking.
  </text>

  <!-- Domain badge -->
  <g transform="translate(100, 520)">
    <text x="0" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" fill="#ecf9fb">
      🌐 securospace.com
    </text>
  </g>

  <!-- Floating UI Mockup card on right -->
  <g transform="translate(680, 130)">
    <rect width="420" height="390" rx="24" fill="url(#cardGrad)" stroke="rgba(160, 216, 219, 0.25)" stroke-width="2" />
    <!-- Window controls -->
    <circle cx="28" cy="28" r="6" fill="#ec6a68" />
    <circle cx="48" cy="28" r="6" fill="#f0c97a" />
    <circle cx="68" cy="28" r="6" fill="#58d68d" />

    <!-- Mini Dashboard Panels -->
    <!-- Daily Focus -->
    <rect x="24" y="60" width="176" height="84" rx="14" fill="rgba(106, 215, 214, 0.15)" stroke="rgba(106, 215, 214, 0.3)" />
    <text x="40" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#a9c5c7">Focus Score</text>
    <text x="40" y="122" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#6ad7d6">94%</text>

    <!-- Habit Streaks -->
    <rect x="220" y="60" width="176" height="84" rx="14" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="236" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#a9c5c7">Habit Streaks</text>
    <text x="236" y="122" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#f0c97a">18 Days 🔥</text>

    <!-- Financial Cashflow -->
    <rect x="24" y="160" width="372" height="96" rx="14" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="40" y="188" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#a9c5c7">Net Monthly Savings</text>
    <text x="40" y="230" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="32" fill="#58d68d">+$3,850.00</text>

    <!-- Encrypted Vault Status -->
    <rect x="24" y="272" width="372" height="90" rx="14" fill="rgba(106, 215, 214, 0.08)" stroke="rgba(106, 215, 214, 0.2)" />
    <text x="40" y="300" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#6ad7d6">🔒 Zero-Knowledge Vault Active</text>
    <text x="40" y="332" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#a9c5c7">AES-256-GCM Hardware-Accelerated</text>
  </g>
</svg>
